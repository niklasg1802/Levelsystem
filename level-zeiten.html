<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level-Übersicht — MAXIMUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#080706; --brown:#594D46; --rust:#594D46; --sand:#EFEFEF;
  --ink:#080706; --ink-dim:rgba(8,7,6,.64); --ink-faint:rgba(8,7,6,.4);
  --line:rgba(8,7,6,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--sand);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;min-height:100vh;padding:72px 28px 96px}
.wrap{max-width:1060px;margin:0 auto}

.page-head .kicker{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:18px}
.page-head h1{font-family:'Fraunces',serif;font-weight:550;font-size:clamp(34px,5.5vw,54px);letter-spacing:-.01em}

.lvl-tables{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:48px;margin-top:56px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim);text-align:left;padding:0 8px 12px;border-bottom:1px solid var(--ink)}
th:first-child{color:var(--rust)}
td{padding:11px 8px;font-size:14px;border-bottom:1px solid var(--line)}
td:first-child{font-family:'Fraunces',serif;font-size:16px;font-weight:600;white-space:nowrap}
.time{font-family:'Fraunces',serif;font-size:16px;font-weight:500}
.pct{display:block;font-family:'Instrument Sans',sans-serif;font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--ink-faint);margin-top:2px}
tr.hit td{color:var(--rust)}
tr.hit .pct{color:var(--rust);opacity:.75}
tr:last-child td{border-bottom:none}

.backtop{display:inline-flex;align-items:center;gap:8px;margin-top:44px;color:var(--ink-faint);font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;transition:color .2s}
.backtop:hover{color:var(--rust)}

@media(max-width:900px){.lvl-tables{grid-template-columns:1fr;gap:40px}}
</style>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <p class="kicker">Sechs Monate · Drei Disziplinen</p>
    <h1>Level-Übersicht</h1>
  </div>

  <div class="lvl-tables">
    <table>
      <thead><tr><th>100m Sprint</th><th>ab Zeit</th></tr></thead>
      <tbody id="tbl-sprint"></tbody>
    </table>
    <table>
      <thead><tr><th>50m Freistil</th><th>ab Zeit</th></tr></thead>
      <tbody id="tbl-swim"></tbody>
    </table>
    <table>
      <thead><tr><th>Calisthenics</th><th>Benchmark</th></tr></thead>
      <tbody id="tbl-cali"></tbody>
    </table>
  </div>
  <a class="backtop" href="index.html">← Zurück zur Skala</a>
</div>

<script>
const LEVELS={
  sprint:[14.0,13.5,13.0,12.6,12.2,11.9,11.6,11.4,11.2,11.0],
  swim:  [39.0,36.5,34.5,32.5,31.0,29.5,28.0,27.0,26.0,25.0]
};
const CALI=[
  "10 saubere Klimmzüge",
  "L-Sit 15s",
  "Freier Handstand 20s",
  "Muscle-up (sauber)",
  "Back Lever full 5s",
  "Front Lever Straddle 5s",
  "Straddle Press to Handstand",
  "Front Lever full 5s",
  "Straddle Planche 5s",
  "Full Planche 5s"
];
const TOP_PCT=[12,6,3,1.5,0.8,0.4,0.2,0.1,0.05,0.02];

function levelTime(sport,t){
  if(!t||t<=0) return 0;
  let lv=0;
  LEVELS[sport].forEach((thr,i)=>{ if(t<=thr) lv=i+1; });
  return lv;
}
function fmtPct(p){
  const s=(p<1?p.toFixed(2):p<10?p.toFixed(1):String(Math.round(p)));
  return s.replace(/\.?0+$/,'').replace('.',',')+'%';
}
function fmtT(t){ return t.toFixed(1).replace('.',',')+' s'; }

function fillTables(cur){
  for(const sport of ['sprint','swim']){
    const tb=document.getElementById('tbl-'+sport);
    let html='';
    for(let i=0;i<10;i++){
      const hit=cur[sport]===i+1?' class="hit"':'';
      html+='<tr'+hit+'><td>L'+(i+1)+'<span class="pct">Top '+fmtPct(TOP_PCT[i])+'</span></td><td class="time">'+fmtT(LEVELS[sport][i])+'</td></tr>';
    }
    tb.innerHTML=html;
  }
  const tb=document.getElementById('tbl-cali');
  let html='';
  for(let i=0;i<10;i++){
    const hit=cur.cali===i+1?' class="hit"':'';
    html+='<tr'+hit+'><td>L'+(i+1)+'<span class="pct">Top '+fmtPct(TOP_PCT[i])+'</span></td><td>'+CALI[i]+'</td></tr>';
  }
  tb.innerHTML=html;
}

async function load(){
  try{
    const res=await fetch('/api/state');
    const state=await res.json();
    const cur={
      sprint: levelTime('sprint', parseFloat(state['fynn-now'])),
      swim: levelTime('swim', parseFloat(state['alex-now'])),
      cali: Math.max(0,Math.min(10,parseInt(state['niklas-now'])||0))
    };
    fillTables(cur);
  }catch(e){
    fillTables({sprint:0,swim:0,cali:0});
  }
}
load();
</script>
</body>
</html>
